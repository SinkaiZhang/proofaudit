name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Run isolated end-to-end smoke audit
        run: |
          proofaudit test-e2e \
            --case examples/minimal/case.json \
            --output "${RUNNER_TEMP}/proofaudit-test-e2e.json" \
            --timeout-ms 60000
